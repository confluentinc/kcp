# yaml-language-server: $schema=https://raw.githubusercontent.com/confluentinc/kcp/main/internal/manifest/gatewaymigration.schema.json
#
# The declarative form of a `kcp migration` run. One file replaces the topology
# and auth flags that used to be repeated across `init` and `execute`.
#
#   kcp migration init      --migration-yaml gateway-migration.yaml
#   kcp migration execute   --migration-yaml gateway-migration.yaml --migration-state-file migration-state.json
#   kcp migration lag-check --migration-yaml gateway-migration.yaml
#
# Paths in this file resolve relative to the PROCESS working directory, not to
# the file's own location. The one exception is spec.gateway.kubeconfig, where a
# leading ~/ is expanded.
#
# This file is secret-bearing when credentials are written inline. Keep it 0600,
# and prefer ${ENV_VAR} references (below) over literal passwords.

apiVersion: kcp.confluent.io/v1alpha1
kind: GatewayMigration

metadata:
  # THE migration identity — unique per state file, and written into the state
  # file's migration_id. Pre-existing uuid-keyed migrations keep working and
  # stay addressable with `--migration-id`.
  name: msk-prod-to-cc-batch-1

# Opt in to ${ENV_VAR} resolution for THIS file. Absent (the default) means
# every value is literal. Each file governs itself: this does not reach into a
# referenced credentials file, which needs its own `interpolate: true`.
#
# Syntax is narrow on purpose: only ${VAR} is a reference (a bare $VAR is not),
# `$${` escapes a literal "${", and an unset variable is a hard error naming the
# variable — an empty password silently attempting auth is the worst outcome.
interpolate: true

spec:
  # kcp only ever READS from the source.
  source:
    type: msk # msk | apache-kafka. Gates auth: iam is msk-only.
    bootstrapServers:
      - b-1.msk-prod.abc123.c2.kafka.us-east-1.amazonaws.com:9096
      - b-2.msk-prod.abc123.c2.kafka.us-east-1.amazonaws.com:9096
    # Either an inline block (below) or a path to a credentials file:
    #   credentials: /etc/kcp/source-creds.yaml
    # The inline mapping is the same shape as that file's top level, so the two
    # spellings are a copy-paste apart. Prefer the path form for a Kubernetes
    # Secret mounted as a file.
    credentials:
      sasl_scram:
        username: ${MSK_USERNAME}
        password: ${MSK_PASSWORD}
        mechanism: SHA512 # SHA256 | SHA512 — MSK is SHA512-only

  target:
    type: confluent-cloud # confluent-cloud | confluent-platform
    clusterId: lkc-abc123 # required for BOTH destination types
    kafka:
      bootstrapServers:
        - pkc-xxxxx.us-east-1.aws.confluent.cloud:9092
      restEndpoint: https://pkc-xxxxx.us-east-1.aws.confluent.cloud:443
      # credentials and restCredentials authenticate two DIFFERENT servers:
      # credentials dials bootstrapServers directly over the Kafka wire
      # protocol (reads/writes destination-side offsets); restCredentials
      # calls restEndpoint's Admin REST API, which is what actually manages
      # the cluster link (status, list/promote mirror topics, alter
      # configs) — the link itself must ALREADY EXIST; kcp never creates
      # one. On self-managed Confluent Platform these are
      # backed by two INDEPENDENT credential stores configured separately on
      # the cluster itself — the Kafka SASL/SCRAM (or mTLS) listener has its
      # own store; the REST API's auth (kafka.rest.authentication.method: a
      # Basic realm file, MDS for bearer, or its own mTLS trust store) has
      # another. A valid Kafka credential is NOT automatically a valid REST
      # credential, even against the same broker process — the two stores
      # only match if you provisioned the same principal into both yourself.
      #
      # The one case where reuse is automatic is Confluent Cloud's sasl_plain
      # key below: Confluent Cloud issues it as a single artifact valid as
      # both the Kafka SASL/PLAIN credential and the REST Basic-auth
      # credential, so kcp can safely derive restCredentials from it. No such
      # platform guarantee exists for sasl_scram/mtls/unauthenticated_*,
      # which is why restCredentials must be spelled out explicitly there.
      #
      # The destination KAFKA leg, dialled directly to read destination-side
      # offsets. Accepts sasl_plain, sasl_scram, mtls, unauthenticated_tls, or
      # unauthenticated_plaintext — iam is rejected (the destination is
      # Confluent Cloud/Platform, never MSK).
      credentials:
        sasl_plain:
          username: ${CC_API_KEY}
          password: ${CC_API_SECRET}
          tls: true
          # ca_cert: /etc/kcp/dest-ca.pem  # honoured here — trusts a private CA
        # insecure_skip_tls_verify is a SIBLING of the auth block, not a key
        # inside it, and it reaches all three connection legs:
        # insecure_skip_tls_verify: true
        #
        # A Confluent Platform destination behind SASL/SCRAM instead of
        # SASL/PLAIN:
        # sasl_scram:
        #   username: ${CP_USERNAME}
        #   password: ${CP_PASSWORD}
        #   mechanism: SHA256 # SHA256 | SHA512
        #   ca_cert: /etc/kcp/dest-ca.pem
        #
        # Or mutual TLS (the client authenticates via its certificate):
        # mtls:
        #   client_cert: /etc/kcp/dest-client.pem
        #   client_key: /etc/kcp/dest-client-key.pem
        #   ca_cert: /etc/kcp/dest-ca.pem
        #
        # Or one-way TLS / plaintext, for a lab/test destination:
        # unauthenticated_tls:
        #   ca_cert: /etc/kcp/dest-ca.pem
        # unauthenticated_plaintext: {}
      #
      # restCredentials is OPTIONAL and DERIVED in full from credentials ONLY
      # when that block is sasl_plain (above): api_key/api_secret from
      # sasl_plain.username/password, and ca_cert/insecure_skip_verify from
      # their sasl_plain siblings.
      #
      # For every other credentials method (sasl_scram, mtls, unauthenticated_*)
      # there is no principal to derive a REST credential from, so
      # restCredentials is REQUIRED. A block that is present is always used
      # exactly as written — never partially derived — so a sasl_plain
      # destination that spells it out anyway must restate the key and secret.
      #
      # restCredentials:
      #   api_key: ${CC_API_KEY}
      #   api_secret: ${CC_API_SECRET}
      #   ca_cert: /etc/kcp/dest-ca.pem
      #
      # Or, alongside a sasl_scram/mtls/unauthenticated_* destination above,
      # any of the REST-specific forms:
      # restCredentials:
      #   basic:
      #     username: ${CP_REST_USERNAME}
      #     password: ${CP_REST_PASSWORD}
      # restCredentials:
      #   bearer:
      #     token: ${CP_REST_TOKEN}
      # restCredentials:
      #   mtls:
      #     client_cert: /etc/kcp/dest-rest-client.pem
      #     client_key: /etc/kcp/dest-rest-client-key.pem

  clusterLink:
    name: msk-to-cc # the link must ALREADY EXIST on the destination
    # Disable the link's consumer.offset.sync.enable during apply and restore it
    # after switchover. Requires the link to currently have it enabled.
    pauseConsumerOffsetSync: true

  gateway:
    namespace: confluent
    # kubeconfig: ~/.kube/config          # optional; a leading ~/ IS expanded
    cr-name: gateway-initial # a Kubernetes object NAME, read live

  # topicGroup pairs the topic selection with the route it migrates and the
  # streaming domain that route switches to. Exactly one entry today — one
  # route, one migration per file.
  #
  # kcp reads the live initial CR, injects fence: {scope: ALL, errorCode:
  # BROKER_NOT_AVAILABLE} onto the named route, and applies the patched CR —
  # there is no separate fenced-CR file to create or keep in sync. The route
  # must exist in the initial CR and must not already be fenced. At cutover kcp
  # derives the switched CR the same way, flipping the route's streamingDomain
  # to the target declared here. This is safe with NO secret or auth change at
  # cutover only because the route's security.cluster already carries pre-staged
  # ("redundant") swap auth for the target domain; kcp proves that staging holds
  # at init (see checkRedundantAuthStaged), before anything is fenced.
  #
  # The route's migration MODE (all-at-once vs topic-based) is read from the
  # live CR's route binding, not declared here.
  topicGroup:
    # topics is a flat list of LITERAL topic names, exact-matched against the
    # link's active mirror topics — not globs. topicPatterns is a list of
    # anchored full-match regular expressions (RE2). At least one of the two is
    # REQUIRED; both may be set (their union is used). To cut over EVERY active
    # mirror topic, use the match-all pattern: topicPatterns: ['.*'].
    #
    # Note the selection has NO effect on `lag-check`, which always watches
    # every mirror.
    - topics: ['t1.order', 't1.inventory', 't2.order']
      # topicPatterns: ['orders\..*']
      route: migration-route # a pre-existing route in the initial CR
      # The target streaming domain — declared in the initial CR's
      # spec.streamingDomains. The bootstrap server id kcp binds the route to is
      # DERIVED from that declaration in the live CR at init, not written here.
      targetStreamingDomain: confluent-cloud

  # OPTIONAL, and read FRESH on every execute — never frozen at init. That is what
  # lets policy be varied between init and execute. Each value is a DEFAULT:
  # `kcp migration execute` can override any of them for a single run with the
  # matching flag (e.g. --detect-unrouted-producers-duration 60s), no edit needed.
  defaultPolicies:
    lagThreshold: 0
    promoteBatchSize: 100 # 0 = promote all at once
    rolloutTimeout: 10m # 0 = no deadline
    detectUnroutedProducersDuration: 30s # 0 = CHECK SKIPPED; min 10s when set
    consumerOffsetSyncDrainDuration: 15s # 0 = no wait; needs pauseConsumerOffsetSync
    hotReloadTimeout: 90s # 0 = built-in 90s budget; never unbounded
    gatewayConfigPort: 0 # 0 = persisted value, falling back to the gateway default (9180)
