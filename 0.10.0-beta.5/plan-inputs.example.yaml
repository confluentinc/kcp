# plan-inputs.yaml — generated by `kcp report plan`.
# One section per scanned cluster. Values are short, stable tokens; the full
# wording is in the comment above each. Open questions are on top; already-
# answered and scan-detected questions are at the bottom (edit to override).
# Fill in the open questions, then re-run:
#   kcp report plan --state-file <state.json> --plan-inputs plan-inputs.yaml

clusters:
  orders-prod:   # region: us-east-1 · partitions (scanned): 5000 · 7 open required, 7 open optional
    # ── REQUIRED — answer these ──
    # How widely is this cluster used?
    #   one-app → One team, one application
    #   few-teams → A few teams or applications
    #   shared-fabric → Shared fabric across many apps and teams
    use_case_breadth:   # not set

    # Do you need to move your existing data?
    #   true → Yes, move my existing data — Brings your history along. Availability depends on your source setup.
    #   false → No, we can start fresh — Points producers and consumers at the new cluster and lets the old one retire
    move_existing_data:   # not set

    # How do you connect to your cluster today?
    #   same-vpc → Same VPC
    #   peered → Peered
    #   privatelink → PrivateLink
    #   other → Other or more than one
    connects_today:   # not set

    # Will any of Confluent Cloud’s managed connectors or consumers need to connect into your private network?
    #   (For example, a connector writing to a private database, or a managed Confluent component calling a private API inside your network.)
    #   true → Yes
    #   false → No
    cc_egress_required:   # not set

    # What Schema Registry does your source environment use?
    #   none → None — Schemaless, or schemas kept in app code
    #   glue → AWS Glue Schema Registry
    #   cp-enterprise-7.1 → Confluent Schema Registry: Enterprise, 7.1 or later — Confluent Platform Enterprise, version 7.1 or later
    #   cp-community → Confluent Schema Registry: Community, or below 7.1 — Community edition, or Confluent Platform below version 7.1
    #   other → Other, not sure
    schema_registry:   # not set

    # What do you want to do with your schemas on Confluent Cloud?
    #   migrate → Migrate my existing schemas
    #   fresh → Start fresh on Confluent Cloud
    #   schemaless → Stay schemaless
    schema_strategy:   # not set

    # Do any of your topics use non-default settings?
    #   (This includes retention over 7 days, a replication factor other than 3, a max message size over 2 MB, or a cleanup policy that combines compact and delete.)
    #   true → Yes
    #   false → No
    topics_have_custom_settings:   # not set

    # ── OPTIONAL — defaults pre-selected, change if needed ──
    # Does your workload exceed any of the following: 1,920 megabytes/sec ingress, 5,760 megabytes/sec egress, or 240,000 requests per second?
    #   true → Yes
    #   false → No  (default)
    exceeds_enterprise_limits: false

    # Which cloud should your new Confluent Cloud cluster run on?
    #   (This is independent of your source cloud. Confluent supports cross-cloud migrations.)
    #   aws → AWS  (default)
    #   azure → Azure
    #   gcp → GCP
    target_cloud: aws

    # Which authentication methods should your Confluent Cloud cluster support? Select all that apply.
    #   (A cluster can support several at once. On AWS we keep your existing mTLS as-is; on Azure and GCP, mTLS needs a Dedicated cluster, which we plan with you. OAuth and API keys are always set up new.)
    #   api-keys → API keys (SASL/PLAIN)
    #   oauth → OAuth
    #   mtls → mTLS
    target_auth: []

    # How much coordination will it take to cut over all your clients and apps at the same time?
    #   easy → Low (few clients, one team)
    #   moderate → Moderate  (default)
    #   hard → High (many clients and teams)
    client_coordination: moderate

    # Do any applications use exactly-once transactions and/or Kafka Streams?
    #   eos → Exactly-once or transactions
    #   kstreams → Kafka Streams
    eos_streams: []

    # Do you want to keep your connectors self-managed, or move them to Confluent-managed?
    #   self-managed → Keep self-managed — Continue to run your own Connect cluster, which is new infrastructure to stand up if you’re moving off MSK Connect
    #   confluent-managed → Move to Confluent-managed — Confluent runs the connector for you — no Connect cluster to stand up, scale, or patch  (default)
    connector_destination: confluent-managed

    # Do your consumers need historical data available after migration?
    #   required → Yes  (default)
    #   not-required → No
    consumer_history_requirement: required

    # ── ALREADY ANSWERED / FROM YOUR SCAN — edit to override ──
    # Is private networking a hard requirement?
    #   (Answer based on your requirement, not your current setup. Public endpoints on Confluent Cloud are authenticated and encrypted.)
    #   true → Yes, private networking is required
    #   false → No, public endpoints are fine
    private_networking_required: true

    # What is your target downtime window at cutover?
    #   window-all → A scheduled window, all at once
    #   window-sequential → A scheduled window, one service at a time
    #   minutes → Minutes per service
    #   seconds → Seconds per service
    #   zero → Zero downtime
    downtime_tolerance: minutes

    # Source cluster type (from your scan)
    #   provisioned → Provisioned
    #   serverless → Serverless
    source_cluster_type: provisioned

    # Source Kafka version (from your scan)
    #   3.0-plus → 3.0 or newer
    #   2.4-2.9 → 2.4–2.9
    #   older → Older than 2.4
    kafka_version: 3.0-plus

    # How your Kafka clients authenticate today (from your scan)
    #   iam → AWS IAM
    #   scram → SASL/SCRAM
    #   mtls → TLS client certificates (mTLS)
    #   unauth → None / plaintext
    source_auth: [scram]

    # Does this cluster use tiered storage? (from your scan)
    #   true → Yes
    #   false → No
    tiered_storage: true

    # Do you use MSK Connect? (from your scan)
    #   true → Yes
    #   false → No
    msk_connect_present: true

    # Do you run self-managed Kafka Connect? (from your scan)
    #   true → Yes
    #   false → No
    self_managed_connectors: false

