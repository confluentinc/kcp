# grafana/otel-lgtm 0.34.0's Tempo config, mounted over the image's copy by
# `make otel-up`, with one change: metrics_generator.registry.stale_duration.
server:
  http_listen_port: 3200
  grpc_listen_port: 9096

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "127.0.0.1:4417"
        http:
          endpoint: "127.0.0.1:4418"

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9096

storage:
  trace:
    backend: local
    wal:
      path: /data/tempo/wal
    local:
      path: /data/tempo/blocks

metrics_generator:
  # Keep span-metric series for the container's lifetime. Tempo drops a series
  # idle for 15m by default and restarts it from zero, which would make the
  # dashboard's across-runs totals forget runs separated by a longer gap.
  registry:
    stale_duration: 24h
  processor:
    span_metrics:
      dimensions:
        - service_name
        - operation
        - status_code
  storage:
    path: /data/tempo/generator/wal
    remote_write:
      - url: http://127.0.0.1:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
