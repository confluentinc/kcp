apiVersion: platform.confluent.io/v1beta1
kind: Gateway
metadata:
  name: gateway-initial
  namespace: confluent
spec:
  routes:
  - endpoint: kafka-gw.example.com:9092
    name: migration-route
    security:
      cluster:
        target:
          auth: passthrough
    streamingDomain:
      bootstrapServerId: sasl-plain
      name: target
  streamingDomains:
  - kafkaCluster:
      name: source-cluster
    name: source
  - kafkaCluster:
      name: target-cluster
    name: target
