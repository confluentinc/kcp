apiVersion: platform.confluent.io/v1beta1
kind: Gateway
metadata:
  name: migration-gateway
spec:
  streamingDomains:
    - name: msk
      kafkaCluster:
        name: msk-cluster
    - name: cc
      kafkaCluster:
        name: cc-cluster
  routes:
    - name: migration-route
      endpoint: kafka-gw.example.com:9092
      mode: dynamic
      streamingDomains:
        - name: msk
          bootstrapServerId: sasl-scram
        - name: cc
          bootstrapServerId: sasl-plain
      rules:
        fencing:
          - trafficType: TRANSACTION
        routing:
          coordination:
            group: msk
          conditions:
            - topicPatterns: ["team-a.*"]
              streamingDomain: msk
          default: msk
