version: v1.0
name: build-test
agent:
  machine:
    type: s1-prod-ubuntu24-04-amd64-1

auto_cancel:
  running:
    when: "branch != 'main'"

execution_time_limit:
  hours: 1

queue:
  - when: "branch != 'main'"
    processing: parallel

global_job_config:
  prologue:
    commands:
      - sem-version node 24.6.0
      - npm install -g yarn@1.22.22
      - sem-version go 1.25.12
      - export "GOPATH=$(go env GOPATH)"
      - export "SEMAPHORE_GIT_DIR=${GOPATH}/src/github.com/confluentinc/${SEMAPHORE_PROJECT_NAME}"
      - export "PATH=${GOPATH}/bin:${PATH}"
      - mkdir -vp "${SEMAPHORE_GIT_DIR}" "${GOPATH}/bin"
      - checkout

blocks:
  - name: 'resolve frontend dependencies'
    dependencies: []
    task:
      jobs:
        - name: 'frontend dependencies'
          commands:
            - cache restore frontend-dependencies
            - cd cmd/ui/frontend && yarn install
      epilogue:
        on_pass:
          commands:
            - >-
              if [ "$SEMAPHORE_GIT_WORKING_BRANCH" = "main" ]; then
                cache delete frontend-dependencies;
                cache store frontend-dependencies node_modules/;
              fi

  - name: 'resolve go dependencies'
    dependencies: []
    task:
      jobs:
        - name: 'go dependencies'
          commands:
            - cache restore go-mod-cache
            - go mod download
      epilogue:
        on_pass:
          commands:
            - >-
              if [ "$SEMAPHORE_GIT_WORKING_BRANCH" = "main" ]; then
                cache delete go-mod-cache;
                cache store go-mod-cache "${GOPATH}/pkg/mod";
              fi

  - name: 'test'
    dependencies: ['resolve frontend dependencies', 'resolve go dependencies']
    task:
      jobs:
        - name: 'run tests'
          commands:
            - cache restore frontend-dependencies
            - cache restore go-mod-cache
            - cache restore go-build-cache
            - cd cmd/ui/frontend && yarn install && yarn build && cd -
            - (cd cmd/ui/frontend && npx playwright install chromium chromium-headless-shell --with-deps)
            - make test-go GOTEST_FLAGS="-p 1 -parallel 4 -count=1"
            - make test-playwright
      epilogue:
        on_pass:
          commands:
            - >-
              if [ "$SEMAPHORE_GIT_WORKING_BRANCH" = "main" ]; then
                cache delete go-build-cache;
                cache store go-build-cache "$HOME/.cache/go-build";
              fi

  - name: 'terraform validation tests'
    dependencies: ['resolve frontend dependencies', 'resolve go dependencies']
    task:
      prologue:
        commands:
          # Terraform is not pre-installed on Semaphore agents
          - curl -sLO https://releases.hashicorp.com/terraform/1.9.5/terraform_1.9.5_linux_amd64.zip
          - unzip -q terraform_1.9.5_linux_amd64.zip
          - sudo install terraform /usr/local/bin/terraform
          - terraform version
      jobs:
        - name: 'terraform validation'
          commands:
            - cache restore frontend-dependencies
            - cache restore go-mod-cache
            - cache restore go-build-cache
            - cd cmd/ui/frontend && yarn install && yarn build && cd -
            - make test-tf-validation GOTEST_FLAGS="-p 1 -parallel 4 -count=1"

  - name: 'integration: osk scan'
    dependencies: ['resolve frontend dependencies', 'resolve go dependencies']
    task:
      prologue:
        commands:
          # keytool (from JDK) is required for TLS certificate generation
          - sem-version java 17
      jobs:
        - name: 'osk scan'
          commands:
            - cache restore frontend-dependencies
            - cache restore go-mod-cache
            - cache restore go-build-cache
            - cd cmd/ui/frontend && yarn install && yarn build && cd -
            - make test-osk-scan

  - name: 'integration: kafka connect scan'
    dependencies: ['resolve frontend dependencies', 'resolve go dependencies']
    task:
      agent:
        machine:
          # This job runs a broker + four Connect JVMs concurrently. The pipeline
          # default (amd64-1) is memory-tight for five JVMs and was contributing to
          # runs being hard-killed mid-startup; use the larger machine already used by
          # the migration e2e block. (Per-JVM heaps are also capped in docker-compose.yml.)
          type: s1-prod-ubuntu24-04-amd64-2
      prologue:
        commands:
          # keytool (from JDK) is required for TLS certificate generation
          - sem-version java 17
      jobs:
        - name: 'kafka connect scan'
          commands:
            - cache restore frontend-dependencies
            - cache restore go-mod-cache
            - cache restore go-build-cache
            - cd cmd/ui/frontend && yarn install && yarn build && cd -
            - make test-kafka-connect

  - name: 'integration: schema registry scan'
    dependencies: ['resolve frontend dependencies', 'resolve go dependencies']
    task:
      jobs:
        - name: 'schema registry scan'
          commands:
            - cache restore frontend-dependencies
            - cache restore go-mod-cache
            - cache restore go-build-cache
            - cd cmd/ui/frontend && yarn install && yarn build && cd -
            - make test-schema-registry

  - name: 'integration: migration e2e'
    dependencies: ['resolve frontend dependencies', 'resolve go dependencies']
    task:
      agent:
        machine:
          type: s1-prod-ubuntu24-04-amd64-2
      env_vars:
        # GCP workload-identity federation for the confluentinc/kcp repo
        # (provisioned in migration-tooling/.infra, module kcp_ci_workload_identity).
        # Matches the hot-reload e2e block below — this suite needs the same
        # ECR pull credentials (no licence: redundant-auth switchover, unlike
        # hot-reload, does not need an Enterprise licence).
        - name: PROJECT_ID
          value: "kcp-prod"
        - name: PROJECT_NUMBER
          value: "118281707876"
        - name: POOL_ID
          value: "kcp-idp-pool"
        - name: PROVIDER_ID
          value: "kcp-idp-provider"
        - name: SERVICE_ACCOUNT_EMAIL
          value: "semaphore-kcp@kcp-prod.iam.gserviceaccount.com"
        # The two ECR pull credentials are read from GCP Secret Manager over
        # that federation by setup.sh — never materialised in the pipeline.
        - name: ECR_AWS_KEY_GCP_SECRET
          value: "kcp-semaphore-ecr-gateway-image-key"
        - name: ECR_AWS_SECRET_GCP_SECRET
          value: "kcp-semaphore-ecr-gateway-image-secret"
        # CFK 0.1838.0 is not public; the chart, the operator image and the
        # gateway app image all come from the kcp-owned ECR OCI mirror in
        # account 635910096382 (setup.sh's defaults).
        - name: CFK_CHART_OCI
          value: "oci://635910096382.dkr.ecr.us-east-1.amazonaws.com/kcp/confluent-for-kubernetes"
        - name: CFK_CHART_VERSION
          value: "0.1838.0"
      prologue:
        commands:
          # Minikube is not pre-installed on Semaphore agents
          - curl -LO https://storage.googleapis.com/minikube/releases/v1.35.0/minikube-linux-amd64
          - sudo install minikube-linux-amd64 /usr/local/bin/minikube
          # Upgrade kubectl to v1.30.0 (agent has 1.23.6, we need 1.30.0 for K8s compatibility)
          - curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          - sudo install kubectl /usr/local/bin/kubectl
          # The AWS CLI (ECR login) may not be on the agent; install only when missing
          # (matches the hot-reload e2e block below). helm already is.
          - command -v aws >/dev/null 2>&1 || (curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip && unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install --update)
          # gcloud SDK is pre-installed at ~/google-cloud-sdk (re-running the installer
          # aborts on the existing dir); install only if missing, then put it on PATH.
          - command -v gcloud >/dev/null 2>&1 || curl https://sdk.cloud.google.com | bash -s -- --disable-prompts
          - export PATH="${HOME}/google-cloud-sdk/bin:${PATH}"
          # Authenticate to GCP via Semaphore's built-in OIDC token so setup.sh can read
          # the ECR credentials (same flow as the hot-reload e2e block below).
          - export POOL_URI="projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${POOL_ID}/providers/${PROVIDER_ID}"
          - echo "${SEMAPHORE_OIDC_TOKEN}" > /tmp/oidc_token
          - gcloud iam workload-identity-pools create-cred-config "${POOL_URI}" --service-account="${SERVICE_ACCOUNT_EMAIL}" --output-file="${HOME}/semaphore/creds.json" --credential-source-file=/tmp/oidc_token --credential-source-type="text"
          - export GOOGLE_APPLICATION_CREDENTIALS="${HOME}/semaphore/creds.json"
          - gcloud auth login --cred-file="${HOME}/semaphore/creds.json" --project="${PROJECT_ID}"
          # Restore cached minikube preloads (K8s tarballs) to skip re-download
          - cache restore minikube-cache
      jobs:
        - name: 'migration e2e'
          commands:
            - cache restore frontend-dependencies
            - cache restore go-mod-cache
            - cache restore go-build-cache
            - cd cmd/ui/frontend && yarn install && yarn build && cd -
            - make test-migration-setup
            - make test-migration
      epilogue:
        always:
          commands:
            - make test-migration-teardown
        on_pass:
          commands:
            - cache store minikube-cache ~/.minikube/cache/

  - name: 'static analysis'
    dependencies: ['resolve frontend dependencies', 'resolve go dependencies']
    task:
      env_vars:
        - name: TRIVY_DB_REPOSITORIES
          value: 'ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db'
      prologue:
        commands:
          - sem-version go 1.25.12
          - export "GOPATH=$(go env GOPATH)"
          - export "SEMAPHORE_GIT_DIR=${GOPATH}/src/github.com/confluentinc/${SEMAPHORE_PROJECT_NAME}"
          - export "PATH=${GOPATH}/bin:${PATH}"
          - mkdir -vp "${SEMAPHORE_GIT_DIR}" "${GOPATH}/bin"
          - cache restore frontend-dependencies
          - cache restore go-mod-cache
          - cache restore go-build-cache
          - cd cmd/ui/frontend && yarn install && yarn build && cd -
      jobs:
        - name: 'golangci-lint'
          commands:
            - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.11.3/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.11.3
            - git fetch origin main
            - golangci-lint run --config .golangci.yml ./...

        - name: 'trivy scan'
          commands:
            - trivy fs --scanners vuln --show-suppressed --db-repository=$TRIVY_DB_REPOSITORIES --severity HIGH,CRITICAL --exit-code 1 .

  - name: 'docs build'
    dependencies: ['resolve go dependencies']
    task:
      prologue:
        commands:
          - sem-version python 3.12
      jobs:
        - name: 'docs build'
          commands:
            - cache restore go-mod-cache
            - cache restore go-build-cache
            # gen-docs embeds cmd/ui/frontend/dist via go:embed; the command
            # reference is pure Cobra output and needs no real assets, so a stub
            # lets it compile without the full frontend build.
            - mkdir -p cmd/ui/frontend/dist && echo '<!doctype html>' > cmd/ui/frontend/dist/index.html
            # Builds a throwaway venv from requirements-docs.txt (no stale cache) and
            # runs `mkdocs build --strict` — catches dependency-resolution conflicts
            # and breaking extension changes before they reach contributors.
            - make docs-build

  - name: 'integration: gateway hot-reload e2e'
    dependencies: ['resolve frontend dependencies', 'resolve go dependencies']
    task:
      agent:
        machine:
          # Matches the migration e2e block: the gateway JVMs + hot-reload canary +
          # source broker need the larger node (setup.sh sizes minikube at 10 GiB / 4 CPU).
          type: s1-prod-ubuntu24-04-amd64-2
      env_vars:
        # GCP workload-identity federation for the confluentinc/kcp repo
        # (provisioned in migration-tooling/.infra, module kcp_ci_workload_identity).
        - name: PROJECT_ID
          value: "kcp-prod"
        - name: PROJECT_NUMBER
          value: "118281707876"
        - name: POOL_ID
          value: "kcp-idp-pool"
        - name: PROVIDER_ID
          value: "kcp-idp-provider"
        - name: SERVICE_ACCOUNT_EMAIL
          value: "semaphore-kcp@kcp-prod.iam.gserviceaccount.com"
        # The licence and the two ECR pull credentials are read from GCP Secret
        # Manager over that federation by setup.sh — never materialised in the pipeline.
        - name: GATEWAY_LICENSE_GCP_SECRET
          value: "kcp-gateway-license"
        - name: ECR_AWS_KEY_GCP_SECRET
          value: "kcp-semaphore-ecr-gateway-image-key"
        - name: ECR_AWS_SECRET_GCP_SECRET
          value: "kcp-semaphore-ecr-gateway-image-secret"
        # CFK 3.3.0 is not public; the chart (and the operator image, via setup.sh's
        # default) come from the kcp-owned ECR OCI mirror in account 635910096382.
        - name: CFK_CHART_OCI
          value: "oci://635910096382.dkr.ecr.us-east-1.amazonaws.com/kcp/confluent-for-kubernetes"
        - name: CFK_CHART_VERSION
          value: "0.1718.34"
      prologue:
        commands:
          # Minikube + a K8s-1.30 kubectl are not pre-installed (same as migration e2e).
          - curl -LO https://storage.googleapis.com/minikube/releases/v1.35.0/minikube-linux-amd64
          - sudo install minikube-linux-amd64 /usr/local/bin/minikube
          - curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          - sudo install kubectl /usr/local/bin/kubectl
          # Helm (installs the CFK chart) and the AWS CLI (ECR login) may not be on
          # the agent; install a pinned helm / awscli v2 only when missing.
          - command -v helm >/dev/null 2>&1 || (curl -fsSL https://raw.githubusercontent.com/helm/helm/v3.16.4/scripts/get-helm-3 | DESIRED_VERSION=v3.16.4 bash)
          - command -v aws >/dev/null 2>&1 || (curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip && unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install --update)
          # gcloud SDK is pre-installed at ~/google-cloud-sdk (re-running the installer
          # aborts on the existing dir); install only if missing, then put it on PATH.
          - command -v gcloud >/dev/null 2>&1 || curl https://sdk.cloud.google.com | bash -s -- --disable-prompts
          - export PATH="${HOME}/google-cloud-sdk/bin:${PATH}"
          # Authenticate to GCP via Semaphore's built-in OIDC token so setup.sh can read
          # the licence + ECR credentials (same flow as kcp-release/publish_release.yml).
          - export POOL_URI="projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${POOL_ID}/providers/${PROVIDER_ID}"
          - echo "${SEMAPHORE_OIDC_TOKEN}" > /tmp/oidc_token
          - gcloud iam workload-identity-pools create-cred-config "${POOL_URI}" --service-account="${SERVICE_ACCOUNT_EMAIL}" --output-file="${HOME}/semaphore/creds.json" --credential-source-file=/tmp/oidc_token --credential-source-type="text"
          - export GOOGLE_APPLICATION_CREDENTIALS="${HOME}/semaphore/creds.json"
          - gcloud auth login --cred-file="${HOME}/semaphore/creds.json" --project="${PROJECT_ID}"
          # Restore cached minikube preloads (K8s tarballs) to skip re-download.
          - cache restore minikube-cache
      jobs:
        - name: 'gateway hot-reload e2e'
          commands:
            - cache restore frontend-dependencies
            - cache restore go-mod-cache
            - cache restore go-build-cache
            - cd cmd/ui/frontend && yarn install && yarn build && cd -
            - make test-migration-hot-reload-setup
            - make test-migration-hot-reload-run
      epilogue:
        always:
          commands:
            - make test-migration-hot-reload-teardown
        on_pass:
          commands:
            - cache store minikube-cache ~/.minikube/cache/
