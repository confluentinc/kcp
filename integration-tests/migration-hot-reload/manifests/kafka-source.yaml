# Single-node KRaft broker backing the gateway's source streaming domain.
#
# Deliberately stupid: no PVC, no auth, no cluster link, no mirror topics. Its
# only job is to be a reachable Kafka the gateway can proxy to, so the fence can
# be observed as a data-plane fact (writes stop landing) rather than only as a
# control-plane one (configId converged). Anything more and this rig turns into a
# second migration e2e.
#
# node.id MUST be 0 to fall inside the gateway's nodeIdRanges (pool-1, 0..0) in
# templates/gateway-base.yaml.
apiVersion: v1
kind: Service
metadata:
  name: kafka-source
  namespace: confluent
  labels:
    app: kafka-source
spec:
  clusterIP: None
  # Publish the address even while the pod is NotReady. A headless Service
  # normally withdraws unready endpoints from DNS; the gateway then fails to
  # resolve its upstream and the producer sees BROKER_NOT_AVAILABLE — which is
  # indistinguishable from a working fence. The fence is the variable under test,
  # so Kubernetes readiness must not be able to forge its signal.
  publishNotReadyAddresses: true
  selector:
    app: kafka-source
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-source
  namespace: confluent
  labels:
    app: kafka-source
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-source
  template:
    metadata:
      labels:
        app: kafka-source
    spec:
      containers:
        - name: kafka
          image: __KAFKA_IMAGE__
          ports:
            - containerPort: 9092
              name: plaintext
          env:
            # Small on purpose. setup.sh sizes the node by gateway replicas (+1
            # canary) and an undersized node has already OOM-killed the kubelet
            # once, which presented as a failed hot reload rather than as memory
            # pressure.
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
            # KRaft requires a 22-character cluster id.
            - name: CLUSTER_ID
              value: "kcp-e2e-hotreload-src0"
            - name: KAFKA_NODE_ID
              value: "0"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@localhost:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # The gateway rewrites what clients see, but the broker still has to
            # advertise an address the gateway itself can dial.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-source.confluent.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # The suite creates its topic explicitly in setup.sh. Auto-creation
            # would let a typo'd topic name silently succeed.
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "1400Mi"
          # A tcpSocket probe, deliberately not an exec of
          # kafka-broker-api-versions: that spawns a full JVM inside this
          # memory-capped container every period, and under contention the probe
          # times out and reports the broker NotReady while it is in fact
          # healthy. Combined with a headless Service that is a self-inflicted
          # outage that mimics the fence.
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
