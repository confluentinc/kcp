# Static gateway CR fixture for the reversibleStaticMigration e2e: domains cp
# (spec.source) and cc (spec.target), one bootstrap server id each, auth staged
# for both on the route. The route is bound to cc, unfenced.
apiVersion: gateway.confluent.io/v1
kind: Gateway
metadata:
  name: migplan-reversible-bound-cc
spec:
  streamingDomains:
    - name: cp
      kafkaCluster:
        bootstrapServers:
          - id: CP
            endpoint: localhost:19192
    - name: cc
      kafkaCluster:
        bootstrapServers:
          - id: CC
            endpoint: localhost:29192
  routes:
    - name: migration-route
      mode: static
      streamingDomain:
        name: cc
        bootstrapServerId: CC
      security:
        cluster:
          cp:
            secretStore: vault
            authentication:
              secretRef: cp-redundant-auth
          cc:
            secretStore: vault
            authentication:
              secretRef: cc-redundant-auth
