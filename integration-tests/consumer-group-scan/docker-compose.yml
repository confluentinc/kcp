      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx640m -Xms256m"
      CLUSTER_ID: UnIfIeDtEsTcLuStEr38B
