# Consumer-group discovery matrix: five single-node KRaft brokers spanning the
# group-protocol evolution, so the scan is validated against every group type on
# the broker version where that type is real.
#   kafka-37 (AK 3.7) — ListGroups max v4 → NO type            (fallback cell)
#   kafka-38 (AK 3.8) — ListGroups v5     → classic labelled "classic"
#   kafka-40 (AK 4.0) — KIP-848 GA        → "consumer" type
#   kafka-41 (AK 4.1) — KIP-932 GA        → "share" type
#   kafka-42 (AK 4.2) — KIP-1071 GA       → "streams" type (also classic/consumer/share)
#
# Heaps are capped (KAFKA_HEAP_OPTS) because CI runs all five brokers plus a
# Streams JVM concurrently on one machine.
services:
  kafka-37:
    image: apache/kafka:3.7.0
    hostname: kafka-37
    container_name: kcp-cg-kafka-37
    ports: ["39092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-37:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-37:29092,HOST://localhost:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx640m -Xms256m"
      CLUSTER_ID: UnIfIeDtEsTcLuStEr37A
  kafka-38:
    image: apache/kafka:3.8.0
    hostname: kafka-38
    container_name: kcp-cg-kafka-38
    ports: ["39093:9092"]
