# Runner pod for the TBM hot-reload suite.
#
# The test binary runs IN the cluster rather than on the developer's machine
# because the engine reads the live gateway CR with in-cluster config and kcp
# verifies a hot reload by dialling each gateway pod's IP on the /config port.
# Pod IPs are not routable from the host under the minikube docker driver, so a
# host-side run could only ever test a port-forwarded stand-in.
#
# setup.sh applies this file directly (no templating) after the tbm-rest-credentials
# Secret exists; run.sh only ships binaries + rendered manifests into the pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kcp-runner
  namespace: confluent
---
# CRD reads are cluster-scoped, so DetectCapability needs a ClusterRole. This is
# the first thing kcp does: without it it cannot tell a configId-capable operator
# from an old one and downgrades to rollout verification, which would make the
# suite pass while testing nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kcp-runner-crd-reader
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kcp-runner-crd-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kcp-runner-crd-reader
subjects:
- kind: ServiceAccount
  name: kcp-runner
  namespace: confluent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kcp-runner
  namespace: confluent
rules:
- apiGroups: ["platform.confluent.io"]
  resources: ["gateways"]
  # patch covers server-side apply, which is how kcp writes a CR.
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kcp-runner
  namespace: confluent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kcp-runner
subjects:
- kind: ServiceAccount
  name: kcp-runner
  namespace: confluent
---
apiVersion: v1
kind: Pod
metadata:
  name: kcp-runner
  namespace: confluent
  labels:
    app: kcp-runner
spec:
  serviceAccountName: kcp-runner
  containers:
  - name: runner
    image: alpine:3.20
    command: ["sleep", "infinity"]
    workingDir: /workspace
    # The destination SASL credential reaches the runner ONLY here, from the
    # tbm-rest-credentials Secret — never on a kubectl exec argv (apiserver
    # audit-log leak). PromoteMirrors/execute-tbm read these via os.Getenv.
    env:
    - name: KCP_TBM_DEST_SASL_USER
      valueFrom:
        secretKeyRef:
          name: tbm-rest-credentials
          key: username
    - name: KCP_TBM_DEST_SASL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: tbm-rest-credentials
          key: password
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"
  volumes:
  - name: workspace
    emptyDir: {}
