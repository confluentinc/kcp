clusters:
  - id: connect-kafka
    bootstrap_servers:
      - localhost:9092
    auth_method:
      unauthenticated_plaintext:
        use: true
    prometheus:
      url: http://localhost:9390
      # Point task-count at a relabelled series that only exists under this
      # non-standard name (seeded by seed-connect-prometheus-data.sh at a
      # distinctive constant, 424). This harness has no JMX exporter scraping
      # Connect into Prometheus, so the default series
      # (kafka_connect_worker_task_count) doesn't exist at all here — the
      # override is what makes task-count resolve, proving the substitution
      # end-to-end.
      connect_metric_names:
        task-count: acme_connect_task_count
    metadata:
      environment: test
      location: connect-scan
