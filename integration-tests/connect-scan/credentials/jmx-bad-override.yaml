clusters:
  - id: connect-kafka
    bootstrap_servers:
      - localhost:9092
    auth_method:
      unauthenticated_plaintext:
        use: true
    jolokia:
      endpoints:
        - http://localhost:18781/jolokia
      # Point task-count at an MBean this worker's Jolokia agent does not
      # expose. The read fails on every poll; kcp must degrade gracefully —
      # omit task-count, still collect the other Connect metrics — and log the
      # miss loudly (Warn) because an overridden MBean that returns nothing is
      # actionable.
      connect_mbean_overrides:
        task-count: "kafka.connect:type=nonexistent-connect-worker-metrics"
    metadata:
      environment: test
      location: connect-scan
