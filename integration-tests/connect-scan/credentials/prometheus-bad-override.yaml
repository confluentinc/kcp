clusters:
  - id: connect-kafka
    bootstrap_servers:
      - localhost:9092
    auth_method:
      unauthenticated_plaintext:
        use: true
    prometheus:
      # This URL is never dialed by the validation test that uses this fixture:
      # credential validation (unknown connect_metric_names key, below) fails
      # before the scan ever reaches a Prometheus backend. This suite's
      # docker-compose does not stand up Prometheus at all (Jolokia-only).
      url: http://localhost:9290
      # "Task-Count" is a wrong-case typo of the canonical "task-count" label.
      # The credential validator must reject it at load time rather than
      # silently no-op, so the scan fails fast with a helpful message.
      connect_metric_names:
        Task-Count: acme_connect_task_count
    metadata:
      environment: test
      location: connect-scan
