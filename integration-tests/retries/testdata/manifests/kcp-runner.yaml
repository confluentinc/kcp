# Runner pod for the retries suite.
#
# The test binary runs IN the cluster: kcp reads the live gateway CR with in-cluster
# config and verifies a hot reload by dialling each gateway pod's IP, which is not
# routable from the host under the minikube docker driver. The pod also injects the
# faults: it carries NET_ADMIN and iptables, so a test can make the source, the
# destination or the destination REST endpoint disappear from kcp's point of view
# without touching the clusters. setup.sh applies this file directly after the
# retries-rest-credentials Secret exists; run.sh only ships binaries and rendered files in.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kcp-runner
  namespace: confluent
---
# CRD reads are cluster-scoped, so DetectCapability needs a ClusterRole. This is
# the first thing kcp does: without it it cannot tell a configId-capable operator
# from an old one and downgrades to rollout verification, which would make the
# suite pass while testing nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kcp-runner-crd-reader
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kcp-runner-crd-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kcp-runner-crd-reader
subjects:
- kind: ServiceAccount
  name: kcp-runner
  namespace: confluent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kcp-runner
  namespace: confluent
rules:
- apiGroups: ["platform.confluent.io"]
  resources: ["gateways"]
  # patch covers server-side apply, which is how kcp writes a CR.
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  # proxy is how ensureGatewayCapability reaches each gateway pod's /config
  # endpoint through the API server when the gateway has no REST endpoint of
  # its own (PR #437, "Gateway config proxy transport") — get on pods alone
  # does not cover this subresource.
  resources: ["pods/proxy"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kcp-runner
  namespace: confluent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kcp-runner
subjects:
- kind: ServiceAccount
  name: kcp-runner
  namespace: confluent
---
apiVersion: v1
kind: Pod
metadata:
  name: kcp-runner
  namespace: confluent
  labels:
    app: kcp-runner
spec:
  serviceAccountName: kcp-runner
  containers:
  - name: runner
    image: alpine:3.20
    # iptables is installed at start (the pod has internet access); the readiness
    # probe waits for it, so setup.sh and run.sh never see a runner that cannot
    # inject a fault.
    command: ["sh", "-c", "apk add --no-cache iptables >/dev/null && touch /tmp/iptables-ready && exec sleep infinity"]
    readinessProbe:
      exec:
        command: ["test", "-f", "/tmp/iptables-ready"]
      periodSeconds: 3
      failureThreshold: 60
    workingDir: /workspace
    securityContext:
      capabilities:
        add: ["NET_ADMIN"]
    # The destination SASL credential reaches the runner ONLY here, from the
    # retries-rest-credentials Secret — never on a kubectl exec argv (apiserver
    # audit-log leak). execute reads these via os.Getenv.
    env:
    - name: KCP_RETRIES_DEST_SASL_USER
      valueFrom:
        secretKeyRef:
          name: retries-rest-credentials
          key: username
    - name: KCP_RETRIES_DEST_SASL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: retries-rest-credentials
          key: password
    volumeMounts:
    - name: workspace
      mountPath: /workspace
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"
  volumes:
  - name: workspace
    emptyDir: {}
