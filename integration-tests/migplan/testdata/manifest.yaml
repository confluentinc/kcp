# GatewayMigration manifest for the migplan command-level e2e (the plaintext
# docker env). It stands in for the operator's declared migration intent: the
# connection topology plus spec.topicGroup (which topics move, on which route, to
# which target domain). Plaintext everywhere; the credentials files are siblings
# of this manifest. The unauthenticated cp-server REST ignores the bogus `basic`
# linkCredentials block (the schema has no unauthenticated-REST form).
apiVersion: kcp.confluent.io/v1alpha1
kind: GatewayMigration
metadata:
  name: migplan-e2e
spec:
  # The topic-based reconcile selector — read by `kcp migration reconcile`.
  topicGroup:
    - topics:
        - team-a.orders
        - team-a.payments
        - billing-v2
      route: migration-route
      targetStreamingDomain: cc

  source:
    type: apache-kafka
    bootstrapServers:
      - localhost:19092
    credentials: testdata/source-creds.yaml

  target:
    type: confluent-platform
    clusterId: LKsbYRvfTM-TVXKjdjgdxA
    kafka:
      bootstrapServers:
        - localhost:29092
      restEndpoint: http://localhost:28090
      clusterCredentials: testdata/dest-kafka-creds.yaml

  clusterLink:
    name: migplan-link
    bootstrapServers:
      - localhost:29092
    linkCredentials: testdata/link-creds.yaml

  # Not read by `migration reconcile` (it uses --gateway-config), but the manifest
  # still validates the gateway section. Minimal satisfying values: the reshaped
  # schema carries only namespace + cr-name (the CR object name, read live); the
  # route and target domain live in spec.topicGroup above.
  gateway:
    namespace: confluent
    cr-name: migplan-e2e
