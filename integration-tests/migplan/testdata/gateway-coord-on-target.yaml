# Permutation fixture: coordination.group pinned to the TARGET domain (cc)
# instead of the source (msk). Topic-unaware APIs must stay pinned on the source
# during migration, so the "coordination.group pinned on source" precondition
# must fail and refuse.
apiVersion: gateway.confluent.io/v1
kind: Gateway
metadata:
  name: migplan-coord-on-target
spec:
  routes:
    - name: migration-route
      mode: dynamic
      streamingDomains:
        - name: msk
          bootstrapServers: localhost:19092
        - name: cc
          bootstrapServers: localhost:29092
      rules:
        routing:
          coordination:
            group: cc
          default: msk
